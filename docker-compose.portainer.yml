# Compose mínimo para deploy via "Stack a partir de Git" no Portainer.
# Sobe UM único container (API + Web); o PostgreSQL continua no HOST (não vira container).
# Só existe para permitir buildar o repositório privado e subir tudo pela UI do Portainer.
services:
  vismed:
    build:
      context: .
      dockerfile: Dockerfile
    image: vismed:latest
    # A imagem e SEMPRE buildada localmente pelo Dockerfile (nao existe em registry).
    # Isso evita o "pull access denied for vismed" quando o Portainer tenta dar pull.
    pull_policy: build
    container_name: vismed
    ports:
      # host:container — a 5000 do HOST costuma estar ocupada por outros apps neste
      # servidor (ex.: app-politicall usa 5000:5000). Publicamos numa porta livre do host
      # (5400) apontando para a 5000 interna do container (onde o Next.js escuta).
      - "5400:5000"
    environment:
      # Defina estas nas "Environment variables" da stack no Portainer:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      VISMED_API_PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Opcionais (descomente/defina se precisar):
      # SKIP_DB_INIT: "false"
      # SKIP_SEED: "false"
      # DISABLE_SYNC_CRON: "true"
      # REDIS_PASSWORD: ""
    extra_hosts:
      # Faz o container enxergar o PostgreSQL rodando no host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: vismed-redis
    # Sem "ports:": o Redis fica acessível SOMENTE dentro da network da stack
    # (o container vismed alcança via hostname "redis"); nada é publicado no host.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
